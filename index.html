<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤 Karaoke Night</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0818;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:0 0 2rem}

.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient::before{content:'';position:absolute;top:-180px;left:50%;transform:translateX(-50%);width:900px;height:500px;background:radial-gradient(ellipse,rgba(127,119,221,.18) 0%,transparent 65%)}
.ambient::after{content:'';position:absolute;bottom:-80px;right:5%;width:400px;height:300px;background:radial-gradient(ellipse,rgba(29,158,117,.09) 0%,transparent 65%)}

.page{position:relative;z-index:1;width:100%;max-width:640px;padding:1.25rem 1rem 0}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:rgba(255,255,255,.7)}
.logo em{font-style:normal;font-size:22px}
.hdr-right{display:flex;gap:7px;align-items:center}
.pill{font-size:11px;background:rgba(127,119,221,.15);color:#afa9ec;border:1px solid rgba(127,119,221,.25);padding:3px 10px;border-radius:20px;transition:background .3s}
.pill.flash{background:rgba(29,158,117,.25);color:#5dcaa5;border-color:rgba(93,202,165,.3)}
.sync-btn{background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.35);border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;transition:all .15s}
.sync-btn:hover{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.7)}
.sync-btn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* NOW PLAYING big card */
.now-card{background:linear-gradient(135deg,rgba(127,119,221,.15),rgba(83,74,183,.08));border:1px solid rgba(127,119,221,.3);border-radius:18px;padding:1.4rem 1.6rem;position:relative;overflow:hidden;margin-bottom:10px}
.now-card::after{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;background:radial-gradient(circle,rgba(127,119,221,.12),transparent 70%);pointer-events:none}
.nc-eyebrow{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.8px;color:#afa9ec;margin-bottom:.6rem;display:flex;align-items:center;gap:6px}
.nc-dot{width:6px;height:6px;border-radius:50%;background:#afa9ec;animation:blink 1.5s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.nc-title{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.2;margin-bottom:.3rem}
.nc-pos{font-size:12px;color:rgba(255,255,255,.35)}
.play-btn{position:absolute;top:1.4rem;right:1.5rem;background:rgba(127,119,221,.25);border:1px solid rgba(127,119,221,.4);color:#d4d0f6;border-radius:11px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
.play-btn:hover{background:rgba(127,119,221,.4);border-color:rgba(127,119,221,.6);color:#fff}
.play-btn:disabled{opacity:.3;cursor:default}
.play-btn .arrow{font-size:16px}

/* next 2 */
.next-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.nc2{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
.nc2:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16)}
.nc2.dim{opacity:.35;pointer-events:none}
.nb{width:28px;height:28px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nb1{background:rgba(255,255,255,.12);color:rgba(255,255,255,.65)}
.nb2{background:rgba(255,255,255,.07);color:rgba(255,255,255,.35)}
.nc2-info{flex:1;min-width:0}
.nc2-title{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc2-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:1px}

/* controls */
.ctrls{display:flex;gap:8px;margin-bottom:10px}
.cb{border:none;border-radius:12px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600}
.cb:active{transform:scale(.96)}
.cb:disabled{opacity:.3;cursor:default}
.cb-side{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);width:50px;height:50px;font-size:19px}
.cb-side:hover:not(:disabled){background:rgba(255,255,255,.12);color:rgba(255,255,255,.9)}
.cb-main{background:linear-gradient(135deg,#7f77dd,#534ab7);color:#fff;flex:1;height:50px;letter-spacing:.2px}
.cb-main:hover:not(:disabled){filter:brightness(1.1)}

/* queue */
.queue-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden}
.qhdr{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.qlbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.3)}
.qmeta{font-size:11px;color:rgba(255,255,255,.25)}
.qlist{max-height:260px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.qi{display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .12s}
.qi:last-child{border-bottom:none}
.qi:hover{background:rgba(255,255,255,.05)}
.qi.active{background:rgba(127,119,221,.1);border-left:3px solid #7f77dd}
.qi.played{opacity:.28}
.qi-n{font-size:11px;color:rgba(255,255,255,.25);min-width:22px;text-align:right;flex-shrink:0}
.qi-ico{font-size:12px;min-width:14px;text-align:center;flex-shrink:0}
.qi-t{font-size:12px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi-d{font-size:10px;color:rgba(255,255,255,.25);flex-shrink:0}
.qi-play{font-size:10px;background:rgba(127,119,221,.2);color:#afa9ec;border:none;border-radius:6px;padding:2px 8px;cursor:pointer;font-family:inherit;flex-shrink:0;display:none}
.qi:hover .qi-play{display:block}

.empty{padding:2rem;text-align:center;color:rgba(255,255,255,.3);font-size:13px;line-height:1.7}

/* footer */
.foot{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.25);margin-top:10px;padding:0 2px}
kbd{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:1px 5px;font:inherit;font-size:10px}
.ldot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3);display:inline-block;margin-right:4px;animation:blink 2s ease infinite}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="page">

  <div class="hdr">
    <div class="logo"><em>🎤</em> Karaoke Night</div>
    <div class="hdr-right">
      <span class="pill" id="pill">Syncing…</span>
      <button class="sync-btn" id="syncBtn" onclick="doSync()">
        <svg id="syncIco" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        Sync
      </button>
    </div>
  </div>

  <!-- Now Playing -->
  <div class="now-card">
    <div class="nc-eyebrow"><span class="nc-dot"></span> Now Playing</div>
    <div class="nc-title" id="nowTitle">—</div>
    <div class="nc-pos" id="nowPos">Select a song below to begin</div>
    <button class="play-btn" id="playBtn" onclick="openCurrent()" disabled>
      <span class="arrow">▶</span> Open on YouTube
    </button>
  </div>

  <!-- Up Next -->
  <div class="next-row">
    <div class="nc2" id="n1card" onclick="jumpTo(cur+1)">
      <div class="nb nb1">1</div>
      <div class="nc2-info">
        <div class="nc2-title" id="n1t">—</div>
        <div class="nc2-sub">Up next · click to jump</div>
      </div>
    </div>
    <div class="nc2" id="n2card" onclick="jumpTo(cur+2)">
      <div class="nb nb2">2</div>
      <div class="nc2-info">
        <div class="nc2-title" id="n2t">—</div>
        <div class="nc2-sub">After that</div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="ctrls">
    <button class="cb cb-side" id="btnPrev" onclick="move(-1)" title="Previous (↑)">↑</button>
    <button class="cb cb-main" id="btnOpen" onclick="openCurrent()" disabled>▶&nbsp; Open on YouTube</button>
    <button class="cb cb-side" id="btnNext" onclick="move(1)" title="Next (↓)">↓</button>
  </div>

  <!-- Queue -->
  <div class="queue-card">
    <div class="qhdr">
      <span class="qlbl">Full Playlist</span>
      <span class="qmeta" id="qmeta">—</span>
    </div>
    <div class="qlist" id="qlist">
      <div class="empty">Fetching playlist from YouTube…</div>
    </div>
  </div>

  <div class="foot">
    <span><kbd>↑</kbd><kbd>↓</kbd> navigate &nbsp;·&nbsp; <kbd>Enter</kbd> open</span>
    <span><span class="ldot"></span>Auto-sync in <span id="cd">60</span>s &nbsp;<span id="updTxt"></span></span>
  </div>
</div>

<script>
const PL   = 'PL0xr20H5TtS7qx6Q3DaC---Y5aErrXggS';
const APIS = [
  'https://pipedapi.kavin.rocks',
  'https://pipedapi.adminforge.de',
  'https://api.piped.yt',
  'https://pipedapi.drgns.space'
];

let songs = [], cur = 0;
let ytWindow = null;

function fmtDur(s){
  if(!s||s<0) return '';
  return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
}

// ── Fetch playlist ──
async function fetchPlaylist(){
  for(const api of APIS){
    try{
      const r = await fetch(`${api}/playlists/${PL}`,{signal:AbortSignal.timeout(6000)});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d = await r.json();
      const list = (d.relatedStreams||d.videos||[])
        .filter(v=>v.url&&v.title)
        .map(v=>({
          id:   v.url.replace('/watch?v=','').split('&')[0].trim(),
          title:v.title.trim(),
          dur:  v.duration
        }));
      if(list.length) return list;
    }catch(e){ console.warn(api,'→',e.message); }
  }
  return null;
}

// ── Load / Sync ──
async function loadPlaylist(isSync){
  document.getElementById('syncBtn').classList.add('spin');
  const fresh = await fetchPlaylist();
  document.getElementById('syncBtn').classList.remove('spin');

  if(fresh){
    const prev = songs.length;
    songs = fresh;
    const pill = document.getElementById('pill');
    if(isSync && songs.length > prev){
      pill.textContent = `+${songs.length-prev} new! 🎉`;
      pill.classList.add('flash');
      setTimeout(()=>{ pill.textContent=`${songs.length} songs`; pill.classList.remove('flash'); },3500);
    } else {
      pill.textContent = `${songs.length} songs`;
    }
    renderQueue();
    updateUI();
  } else {
    document.getElementById('pill').textContent = '⚠ Sync failed';
    if(!songs.length){
      document.getElementById('qlist').innerHTML =
        '<div class="empty">Could not reach YouTube playlist API.<br>Check your internet connection and try Sync again.</div>';
    }
  }
  document.getElementById('updTxt').textContent =
    new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

function doSync(){ loadPlaylist(true); resetCd(); }

// ── Open video ──
function openCurrent(){
  if(!songs[cur]) return;
  const url = 'https://www.youtube.com/watch?v='+songs[cur].id
            + '&list='+PL+'&index='+(cur+1);
  if(ytWindow && !ytWindow.closed){
    ytWindow.location.href = url;
    ytWindow.focus();
  } else {
    ytWindow = window.open(url,'_blank');
  }
}

// ── Navigation ──
function move(dir){
  const n = cur+dir;
  if(n<0||n>=songs.length) return;
  cur = n;
  updateUI();
  // If YouTube window is open, auto-load next video
  if(ytWindow && !ytWindow.closed) openCurrent();
}

function jumpTo(i){
  if(i<0||i>=songs.length) return;
  cur = i;
  updateUI();
  openCurrent();
}

// ── UI ──
function updateUI(){
  const s = songs[cur];
  document.getElementById('nowTitle').textContent = s ? s.title : '—';
  document.getElementById('nowPos').textContent   = s ? `Song ${cur+1} of ${songs.length}` : 'Select a song to begin';
  document.getElementById('n1t').textContent      = songs[cur+1]?.title || '—';
  document.getElementById('n2t').textContent      = songs[cur+2]?.title || '—';
  document.getElementById('n1card').classList.toggle('dim', !songs[cur+1]);
  document.getElementById('n2card').classList.toggle('dim', !songs[cur+2]);
  document.getElementById('btnPrev').disabled = cur <= 0;
  document.getElementById('btnNext').disabled = cur >= songs.length-1;
  document.getElementById('playBtn').disabled = !s;
  document.getElementById('btnOpen').disabled = !s;
  document.getElementById('qmeta').textContent = songs.length ? `${songs.length} songs` : '—';

  // Refresh active row in queue
  document.querySelectorAll('.qi').forEach((el,i)=>{
    el.classList.toggle('active',  i===cur);
    el.classList.toggle('played',  i<cur);
  });
  const active = document.querySelector('.qi.active');
  if(active) active.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function renderQueue(){
  document.getElementById('qlist').innerHTML = songs.map((s,i)=>`
    <div class="qi${i===cur?' active':i<cur?' played':''}" onclick="jumpTo(${i})">
      <span class="qi-n">${i+1}</span>
      <span class="qi-ico">${i===cur?'🎤':i<cur?'✓':''}</span>
      <span class="qi-t" title="${s.title}">${s.title}</span>
      <span class="qi-d">${fmtDur(s.dur)}</span>
      <button class="qi-play" onclick="event.stopPropagation();jumpTo(${i})">▶ Play</button>
    </div>`).join('');
  updateUI();
}

// ── Keyboard ──
document.addEventListener('keydown', e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); move(1); }
  if(e.key==='ArrowUp'){   e.preventDefault(); move(-1); }
  if(e.key==='Enter'){     e.preventDefault(); openCurrent(); }
});

// ── Countdown ──
let cdVal=60, cdTimer;
function resetCd(){
  clearInterval(cdTimer); cdVal=60;
  document.getElementById('cd').textContent=cdVal;
  cdTimer=setInterval(()=>{
    cdVal--;
    const el=document.getElementById('cd');
    if(el) el.textContent=cdVal;
    if(cdVal<=0){ loadPlaylist(true); cdVal=60; }
  },1000);
}

loadPlaylist(false);
resetCd();
</script>
</body>
</html>
